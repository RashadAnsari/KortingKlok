<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- K shape -->
  <path d="M 45 45 L 45 155 M 45 85 L 95 45 M 45 115 L 95 155" 
        stroke="#003B5C" stroke-width="20" stroke-linecap="round" 
        stroke-linejoin="round" fill="none"/>
  <!-- Clock circle -->
  <circle cx="135" cy="100" r="50" fill="none" stroke="#FF6B35" stroke-width="10"/>
  <!-- Hour hand -->
  <line x1="135" y1="100" x2="135" y2="65" stroke="#003B5C" 
        stroke-width="8" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="135" y1="100" x2="158" y2="115" stroke="#003B5C" 
        stroke-width="6" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="135" cy="100" r="6" fill="#FF6B35"/>
  <!-- Clock markers (12, 3, 6, 9 positions) -->
  <line x1="135" y1="55" x2="135" y2="62" stroke="#FF6B35" stroke-width="4" stroke-linecap="round"/>
  <line x1="180" y1="100" x2="173" y2="100" stroke="#FF6B35" stroke-width="4" stroke-linecap="round"/>
  <line x1="135" y1="145" x2="135" y2="138" stroke="#FF6B35" stroke-width="4" stroke-linecap="round"/>
  <line x1="90" y1="100" x2="97" y2="100" stroke="#FF6B35" stroke-width="4" stroke-linecap="round"/>
</svg>