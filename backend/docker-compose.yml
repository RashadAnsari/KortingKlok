services:
  postgres:
    image: postgres:18-alpine
    hostname: postgres
    container_name: postgres
    networks:
      - baseapi
    environment:
      POSTGRES_DB: baseapi
      POSTGRES_PASSWORD: secret
      POSTGRES_USER: baseapi
    ports:
      - 5432:5432

  redis:
    image: redis:8-alpine
    hostname: redis
    container_name: redis
    networks:
      - baseapi
    ports:
      - 6379:6379

networks:
  baseapi:
    name: baseapi
    driver: bridge
