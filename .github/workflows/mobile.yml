name: Mobile

on:
  push:
    branches: [master]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    branches: [master]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"

jobs:
  check:
    name: Lint and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Write placeholder Firebase config
        run: make firebase-placeholders

      - name: Install dependencies
        run: flutter pub get

      - name: Lint
        run: make lint

      - name: Test
        run: flutter test
