- name: Common Setup
  become: true
  hosts: all
  tasks:
    - name: Create configuration directory
      file:
        path: /etc/kortingklok
        state: directory

    - name: Copy docker image to host
      copy:
        src: "{{ docker_image_path }}"
        dest: /etc/kortingklok/docker-image.tar

    - name: Load docker image from .tar file
      shell: |
        docker load < /etc/kortingklok/docker-image.tar

    - name: Delete docker image .tar file
      file:
        path: /etc/kortingklok/docker-image.tar
        state: absent

    - name: Copy firebase-adminsdk.json
      copy:
        src: "{{ firebase_adminsdk_json_path }}"
        dest: /etc/kortingklok/firebase-adminsdk.json

