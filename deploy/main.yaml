- name: Configure Backend 1
  become: true
  hosts: kortingklok-1
  tasks:
    - name: Copy docker-compose file
      template:
        src: tmpls/docker-compose.yml.j2
        dest: /etc/kortingklok/docker-compose.yml

    - name: Set up scraper cron
      cron:
        name: "Scrape all supermarkets"
        minute: "0"
        hour: "11,16"
        job: "docker exec kortingklok_worker python manage.py scrape_all_supermarkets"

- name: Configure Backend 2
  become: true
  hosts: kortingklok-2
  tasks:
    - name: Copy docker-compose file
      template:
        src: tmpls/lidl-compose.yml.j2
        dest: /etc/kortingklok/docker-compose.yml

- name: Deploy
  become: true
  hosts: all
  tasks:
    - name: docker-compose up -d
      shell: |
        docker compose -f /etc/kortingklok/docker-compose.yml up -d

    - name: Remove unused docker images
      shell: |
        docker image prune -a -f
