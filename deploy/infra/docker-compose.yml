services:
  kortingklok-postgres:
    image: postgres:18
    hostname: kortingklok_postgres
    container_name: kortingklok_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kortingklok
      POSTGRES_USER: kortingklok
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kortingklok -d kortingklok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "effective_cache_size=3GB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=5041kB"
      - "-c"
      - "huge_pages=off"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "log_timezone=UTC"
      - "-c"
      - "timezone=UTC"
    networks:
      - kortingklok_network

  kortingklok-redis:
    image: redis:8
    hostname: kortingklok_redis
    container_name: kortingklok_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - kortingklok_network

networks:
  kortingklok_network:
    driver: bridge
    name: kortingklok_network
